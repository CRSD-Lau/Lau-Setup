# Author: Neil Mitchell; Creator: Neil Mitchell; Last Modified By: Neil Mitchell
name: Translate documentation

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - '**.txt'
      - '!docs/i18n/**'
      - 'build/catalog.json'
      - 'tools/translate_docs.py'
      - 'tools/recover_doc_translations.py'
      - 'tools/translation-locales.json'
      - 'tests/test_translate_docs.py'
      - 'tests/test_translation_recovery.py'
      - '.github/workflows/translate-docs.yml'
  pull_request:
    paths:
      - '**.md'
      - '**.txt'
      - 'build/catalog.json'
      - 'tools/translate_docs.py'
      - 'tools/recover_doc_translations.py'
      - 'tools/translation-locales.json'
      - 'tests/test_translate_docs.py'
      - 'tests/test_translation_recovery.py'
      - '.github/workflows/translate-docs.yml'
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-translations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pending: ${{ steps.pending.outputs.pending }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_translate_docs.py -v
      - run: python tools/translate_docs.py --check
      - run: python -m unittest discover -s tests -p test_translation_recovery.py -v
      - id: pending
        run: python tools/recover_doc_translations.py --pending

  translate:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.validate.outputs.pending == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      ready: ${{ steps.recover.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Set recovery directory
        run: echo "TRANSLATION_CACHE_DIR=$RUNNER_TEMP/translation-recovery" >> "$GITHUB_ENV"
      # Only trusted main runs read/write this namespace; PRs perform offline tests.
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.TRANSLATION_CACHE_DIR }}
          key: doc-recovery-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: doc-recovery-v1-
      - name: Resume pending translations
        id: recover
        run: python tools/recover_doc_translations.py
      - name: Preserve progress and provider cooldown even after failure
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.TRANSLATION_CACHE_DIR }}
          key: doc-recovery-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.recover.outputs.ready == 'true'
        with:
          name: translations-complete
          path: docs/i18n/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [validate, translate]
    if: needs.translate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: translations-complete
          path: docs/i18n/
      - name: Verify all generated documents
        run: python tools/translate_docs.py --verify
      - name: Update language links
        run: python tools/translate_docs.py --navigation
      - name: Verify after navigation
        run: python tools/translate_docs.py --verify
      - name: Publish complete translations
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          gh auth setup-git
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$EXPECTED_SHA" ]; then
            echo 'Main changed during translation. The next automatic check will retry on latest main.' >&2
            exit 1
          fi
          git add -- README.md docs/i18n/
          if git diff --cached --quiet; then
            echo 'Translations already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refresh automatic translations'
          git push origin HEAD:main
